<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macrofy - teste de viabilidade</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1c1c1e; --accent: #0a7d4b; --mut: #6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #f2f2f7; --accent: #1f9d68; --mut: #a0a0a8; } }
  body { font: 17px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0 auto; max-width: 34rem; padding: 1rem 16px 3rem; }
  button { font: inherit; font-weight: 600; padding: 1rem; width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: #fff; margin: .5rem 0; }
  button:disabled { opacity: .5; } button.sec { background: none; color: var(--mut); font-weight: 400; padding: .5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } td { padding: .3rem .2rem; border-bottom: 1px solid #8884; }
  textarea { width: 100%; height: 10rem; font: 12px ui-monospace, monospace; box-sizing: border-box; }
  .mut { color: var(--mut); font-size: 14px; } #verdict { font-weight: 700; }
</style>
</head>
<body>
<h1>Teste de viabilidade</h1>
<p>Este teste mede se o celular consegue rodar os modelos de visão do Macrofy. Use o Wi-Fi e mantenha a tela ligada e o Safari aberto: leva alguns minutos e baixa algumas centenas de MB.</p>
<button id="go">Iniciar teste</button>
<p id="status" class="mut" aria-live="polite"></p>
<p class="mut"><label>Opcional: usar uma foto de prato em vez da imagem de exemplo<br>
<input id="photo" type="file" accept="image/*" capture="environment"></label></p>
<section id="results" hidden>
  <h2>Resultados</h2>
  <p id="verdict"></p>
  <table><thead><tr><td>Etapa</td><td>Status</td><td>Motor</td><td>Inferência</td><td>Download</td></tr></thead><tbody id="rows"></tbody></table>
  <button id="copy">Copiar resultados</button>
  <textarea id="out" readonly aria-label="Resultados em JSON"></textarea>
  <button id="reset" class="sec">Apagar resultados salvos</button>
</section>
<script type="module" src="./run.mjs"></script>
</body>
</html>
