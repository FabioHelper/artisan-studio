name: macrofy-pages

# Publishes macrofy/web to the gh-pages branch, which GitHub Pages serves at
# https://fabiohelper.github.io/artisan-studio/ (GITHUB_TOKEN cannot enable Pages via the API).
on:
  push:
    branches: [main]
    paths: ['macrofy/web/**', '.github/workflows/macrofy-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macrofy-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Web selftest
        run: node macrofy/web/selftest.mjs
      - name: Push macrofy/web to gh-pages
        run: |
          git subtree split --prefix macrofy/web -b gh-pages-publish
          git push --force origin gh-pages-publish:gh-pages
