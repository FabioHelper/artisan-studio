name: macrofy-pages

on:
  push:
    branches: [main]
    paths: ['macrofy/web/**', '.github/workflows/macrofy-pages.yml']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: macrofy/web
      - id: deployment
        uses: actions/deploy-pages@v4
